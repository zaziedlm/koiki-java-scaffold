<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{koiki/fragments :: head('KOIKI Java Scaffold')}"></head>
<body>
<header><strong>KOIKI Java Scaffold</strong></header>
<main>
  <h1>KOIKI Java Scaffold</h1>
  <p>ログインしています。</p>
  <dl>
    <dt>User ID</dt><dd data-testid="user-id" th:text="${userId}">-</dd>
    <dt>Permissions</dt><dd th:text="${permissions}">-</dd>
  </dl>
  <form method="post" th:action="@{/logout}"><button type="submit">ログアウト</button></form>
</main>
</body>
</html>
