spring.application.name=koiki-java-scaffold

# Database: supply connection settings from the environment (see compose.yaml / README.md).
spring.datasource.url=${SCAFFOLD_DB_URL:jdbc:postgresql://localhost:5432/scaffold}
spring.datasource.username=${SCAFFOLD_DB_USERNAME:scaffold}
spring.datasource.password=${SCAFFOLD_DB_PASSWORD:}

# JPA validates the schema created by Flyway; never generate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Application-owned migrations. KOIKI migrations run separately (koiki_flyway_history).
spring.flyway.locations=classpath:db/migration/scaffold
spring.flyway.table=scaffold_flyway_history

# Local email + password authentication with server-side JDBC Session.
# The HMAC key ID and a Base64 key of at least 32 bytes come from the deployment environment.
koiki.identity.local-authentication.enabled=true
koiki.identity.login-attempt.source-protection=APPLICATION
koiki.identity.login-attempt.source-hmac-key-id=${KOIKI_SOURCE_HMAC_KEY_ID}
koiki.identity.login-attempt.source-hmac-key=${KOIKI_SOURCE_HMAC_KEY}
