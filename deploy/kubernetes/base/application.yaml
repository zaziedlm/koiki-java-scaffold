apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaffold
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scaffold
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scaffold
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # A deployment overlay must select the image and supply scaffold-runtime.
          image: koiki-java-scaffold:deployment-required
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: scaffold-runtime
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: scaffold
spec:
  selector:
    app.kubernetes.io/name: scaffold
  ports:
    - name: http
      port: 8080
      targetPort: http
