apiVersion: v1
kind: Service
metadata:
  name: scaffold-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: scaffold-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scaffold-db
spec:
  serviceName: scaffold-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scaffold-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scaffold-db
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: scaffold
            - name: POSTGRES_USER
              value: scaffold
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scaffold-runtime
                  key: SCAFFOLD_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: [pg_isready, -h, "127.0.0.1", -U, scaffold, -d, scaffold]
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
