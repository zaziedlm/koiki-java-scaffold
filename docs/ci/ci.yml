name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # Public GitHub Release; no credential is required (method 1).
      - name: Prepare pinned KOIKI distribution
        shell: pwsh
        run: ./tools/prepare-koiki-distribution.ps1

      - name: Verify with Maven Wrapper
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Build container image
        run: docker build --tag koiki-java-scaffold:ci .
